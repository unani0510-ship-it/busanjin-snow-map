let map, markers=[], infoWindow, currentInfo=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function init(){
 if(!window.naver||!naver.maps){$("stat").textContent="네이버 지도 API를 불러오지 못했습니다. Client ID와 등록 도메인을 확인하세요.";return;}
 const valid=LOCATIONS.filter(x=>Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng)));
 const center=new naver.maps.LatLng(35.1628,129.0530);
 map=new naver.maps.Map("map",{center,zoom:13,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.RIGHT_CENTER},mapTypeControl:true});
 infoWindow=new naver.maps.InfoWindow({borderWidth:0,backgroundColor:"#fff",anchorSize:new naver.maps.Size(12,12)});
 const dongs=[...new Set(valid.map(x=>x.dong))].sort((a,b)=>a.localeCompare(b,"ko"));
 dongs.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;$("dong").appendChild(o);});
 $("stat").textContent=`전체 ${valid.length}개소 · ${dongs.length}개 동`;
 valid.forEach((x,i)=>{
   const pos=new naver.maps.LatLng(Number(x.lat),Number(x.lng));
   const marker=new naver.maps.Marker({position:pos,map,title:x.id});
   marker.__data=x;
   naver.maps.Event.addListener(marker,"click",()=>showInfo(marker,x));
   markers.push(marker);
 });
 renderList(valid);
}
function showInfo(marker,x){
 const body=`<div class="info"><b>${esc(x.id)}</b><br>${esc(x.road||x.parcel||"주소 미기재")}<br>${esc(x.detail)}<hr>
 염화칼슘: ${esc(x.calcium_bags||"-")}포 · 모래: ${esc(x.sand_bags||"-")}포<br>
 <small>기준일: ${esc(x.date)}</small></div>`;
 infoWindow.setContent(body);infoWindow.open(map,marker);currentInfo=marker;
}
function renderList(items){
 const box=$("results");box.innerHTML="";
 items.slice(0,100).forEach(x=>{
  const div=document.createElement("div");div.className="item";
  div.innerHTML=`<strong>${esc(x.id)}</strong><small>${esc(x.road||x.parcel||"주소 미기재")}<br>${esc(x.detail)}</small>`;
  div.onclick=()=>{const m=markers.find(z=>z.__data===x);if(m){map.setCenter(m.getPosition());map.setZoom(17);showInfo(m,x);}};
  box.appendChild(div);
 });
 if(items.length>100){const more=document.createElement("div");more.className="note";more.textContent=`검색 결과 ${items.length}개 중 목록에는 처음 100개만 표시됩니다. 지도의 마커는 전체 표시됩니다.`;box.appendChild(more);}
}
function applyFilter(){
 const q=$("search").value.trim().toLowerCase(),d=$("dong").value;
 const filtered=LOCATIONS.filter(x=>(!d||x.dong===d)&&(!q||[x.id,x.road,x.parcel,x.detail,x.dong].join(" ").toLowerCase().includes(q)));
 markers.forEach(m=>m.setMap(filtered.includes(m.__data)?map:null));
 renderList(filtered);
 $("stat").textContent=`검색 결과 ${filtered.length}개소 / 전체 ${LOCATIONS.length}개소`;
}
$("search").addEventListener("input",applyFilter);$("dong").addEventListener("change",applyFilter);
$("all").onclick=()=>{$("search").value="";$("dong").value="";applyFilter();const b=new naver.maps.LatLngBounds();markers.forEach(m=>b.extend(m.getPosition()));map.fitBounds(b);};
$("locate").onclick=()=>{if(!navigator.geolocation){alert("현재 위치 기능을 사용할 수 없습니다.");return;}navigator.geolocation.getCurrentPosition(p=>{const pos=new naver.maps.LatLng(p.coords.latitude,p.coords.longitude);map.setCenter(pos);map.setZoom(16);new naver.maps.Marker({position:pos,map,title:"내 현재 위치",icon:{content:'<div style="background:#1677ff;border:3px solid white;border-radius:50%;width:18px;height:18px;box-shadow:0 1px 5px #555"></div>',anchor:new naver.maps.Point(9,9)}});},()=>alert("위치 권한을 허용해 주세요."),{enableHighAccuracy:true,timeout:10000});};
window.addEventListener("load",init);
</script>
